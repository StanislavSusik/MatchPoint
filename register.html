<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Реєстрація — MatchPoint</title>
  <link rel="stylesheet" href="HEADER/register.css">

</head>
<body>
  <header class="header">
    <div class="header__inner">
      <a href="index.html" class="logo">Match<span>Point</span></a>
      <nav class="nav">
        <a href="index.html">Головна</a>
        <a href="news.html">Новини</a>
        <a href="matches.html">Матчі та турніри</a>
        <a href="media.html">Відео та Фото</a>
        <a href="tv.html">Футбол на ТБ</a>
        <a href="comments.html">Обговорення</a>
      </nav>
      <div class="header__right">
        <button type="button" class="theme-btn" id="themeToggle">Світла тема</button>
        <div class="auth-links">
          <a href="login.html">Увійти</a>
          <a href="register.html">Реєстрація</a>
        </div>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="card">
      <h1>Реєстрація на сайті</h1>

      <form id="registerForm" novalidate>
        <div class="field">
          <label for="email">E-mail:</label>
          <input type="email" id="email" placeholder="Вкажіть e-mail" autocomplete="email">
          <small class="error" id="emailError"></small>
        </div>

        <div class="field">
          <label for="login">Логін:</label>
          <input type="text" id="login" placeholder="Вкажіть логін" autocomplete="username">
          <small class="error" id="loginError"></small>
        </div>

        <div class="field">
          <label for="password">Пароль:</label>
          <input type="password" id="password" placeholder="Пароль" autocomplete="new-password">
          <small class="error" id="passwordError"></small>
        </div>

        <div class="field">
          <label for="password2">Повторіть пароль:</label>
          <input type="password" id="password2" placeholder="Повторіть пароль" autocomplete="new-password">
          <small class="error" id="password2Error"></small>
        </div>

        <div class="field">
          <label>Введіть символи з картинки:</label>
          <div class="captcha">
            <canvas id="captchaCanvas" width="170" height="50"></canvas>
            <button type="button" class="refresh" id="captchaRefresh" aria-label="Оновити картинку">&#x21bb;</button>
          </div>
          <input type="text" id="captchaInput" placeholder="Символи з картинки" autocomplete="off">
          <small class="error" id="captchaError"></small>
        </div>

        <div class="field field--check">
          <label class="check">
            <input type="checkbox" id="agree">
            <span>Я підтверджую <a href="privacy.html">Угода про конфіденційність</a></span>
          </label>
          <small class="error" id="agreeError"></small>
        </div>

        <button type="submit" class="btn">Зареєструватися</button>
        <p class="success" id="successMsg" hidden>Реєстрація пройшла успішно!</p>
      </form>

      <a href="login.html" class="already" id="alreadyLink">Я вже зареєстрований, впустіть!</a>
    </section>
  </main>

  <script src="HEADER/register.js"></script>
</body>
</html>
